name: Build Windows installer

# Manual trigger + on version tags. A pushed tag `v0.1.2` builds the installer
# AND publishes a GitHub Release with K2-Setup.exe attached as an asset — which
# is exactly what the in-app updater (core/updater.py) downloads.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the Release + upload the asset

env:
  # Release that holds the prebuilt native solver binaries (SU2_CFD.exe,
  # ccx.exe, glut64.dll). They're too large for git, so CI pulls them from a
  # pinned release in this repo. Create it once:
  #   gh release create solver-binaries bin/SU2_CFD.exe bin/ccx.exe bin/glut64.dll \
  #     --title "Solver binaries" --notes "Bundled SU2 + CalculiX for CI builds"
  # If the release/assets are missing the build still succeeds, but the
  # installer ships without solvers (app launches, pre/post-processing works).
  SOLVER_RELEASE_TAG: solver-binaries

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Match the development environment (3.12). CI built 0.1.9 on 3.11
          # while dev ran 3.12, so the installer dropped cp311 extension
          # modules beside the cp312 ones an earlier release had left behind.
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Native solvers — best-effort. Pull from the pinned release; never fail
      # the build if they're absent.
      - name: Stage solver binaries
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$SOLVER_RELEASE_TAG" \
            --pattern "SU2_CFD.exe" --pattern "ccx.exe" --pattern "glut64.dll" \
            --dir bin --clobber \
            || echo "::warning::solver binaries not found at release '$SOLVER_RELEASE_TAG' — installer will ship without solvers"

      # A release without solvers is crippled (CFD/FEM solve fails at runtime
      # with "executable not found") — never publish one. Manual test builds
      # (workflow_dispatch) may still proceed without them.
      - name: Require solver binaries for releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          missing=0
          for f in bin/SU2_CFD.exe bin/ccx.exe bin/glut64.dll; do
            [ -f "$f" ] || { echo "::error::$f missing — create/refresh the '$SOLVER_RELEASE_TAG' release (see comment at top of this file)"; missing=1; }
          done
          exit $missing

      - name: Build app (PyInstaller)
        run: pyinstaller K2.spec --noconfirm

      # Fail the build if a runtime dependency didn't make it into the bundle.
      # v0.1.3 shipped without gmsh (absent from requirements.txt, so
      # collect_all("gmsh") in K2.spec silently bundled nothing) and CFD
      # meshing crashed in the installed app. The script exits via sys.exit,
      # so the windowed bootloader never raises its blocking error dialog.
      - name: Smoke-test bundled imports
        shell: bash
        timeout-minutes: 10
        run: |
          cat > smoke_imports.py <<'EOF'
          import sys, traceback
          try:
              import gmsh, pyvista, vtkmodules, sklearn, reportlab, qtawesome, requests
          except Exception:
              with open("smoke_fail.txt", "w") as f:
                  traceback.print_exc(file=f)
              sys.exit(1)
          sys.exit(0)
          EOF
          ./dist/K2/K2.exe --run-script "$(pwd -W)/smoke_imports.py" || {
            echo "::error::bundled import smoke test failed"
            cat smoke_fail.txt 2>/dev/null
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: bash
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
          ls -la installer_output

      - uses: actions/upload-artifact@v7
        with:
          name: K2-Setup
          path: installer_output/K2-Setup.exe

      # Tag builds only: publish the Release with the installer attached so the
      # in-app updater can find a *.exe asset on releases/latest.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: installer_output/K2-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
